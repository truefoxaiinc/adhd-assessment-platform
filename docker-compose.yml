name: adhd-minder

x-app: &app
  image: adhd-minder-backend:${IMAGE_TAG:-latest}
  build:
    context: .
    target: runtime
    network: host
  env_file: [.env.production]
  environment:
    DJANGO_ENV: production
    DEBUG: False
    REDIS_CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/2
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    CHANNEL_REDIS_URL: redis://redis:6379/0
  init: true
  restart: unless-stopped
  networks: [backend]
  volumes: [./media:/app/media]

services:
  migrate:
    <<: *app
    restart: no
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    <<: *app
    command: [daphne, -b, 0.0.0.0, -p, '8000', --proxy-headers, project_adhd.asgi:application]
    ports: [127.0.0.1:8000:8000]
    depends_on:
      migrate: {condition: service_completed_successfully}
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, yes]
    volumes: [redis_data:/data]
    networks: [backend]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.production]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  worker:
    <<: *app
    command: [celery, -A, project_adhd, worker, --loglevel=INFO]
    depends_on:
      migrate: {condition: service_completed_successfully}
  beat:
    <<: *app
    command: [celery, -A, project_adhd, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  postgres_data:
  redis_data:
networks:
  backend:
